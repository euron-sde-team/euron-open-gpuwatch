# ─────────────────────────────────────────────────────────────────────────────
# Euron Open GPUWatch: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4410   api 4430   mailpit 4425 (smtp 4426)   mock-vllm 4450   postgres 4442   redis 4479
#   floci 4466
#
# The `demo` profile (make demo) adds three simulated GPU hosts and a mock vLLM server.
# They run the real agent with its simulated collector and send through the same ingest
# API a real agent uses; nothing in the dashboard is hardcoded.
# ─────────────────────────────────────────────────────────────────────────────
name: gpuwatch

x-api-image: &api-image
  build:
    context: ../../apps/api
    dockerfile: ../../infra/docker/api.Dockerfile
  image: gpuwatch-api:local

x-agent-image: &agent-image
  build:
    context: ../../apps/agent
    dockerfile: ../../infra/docker/agent.Dockerfile
  image: gpuwatch-agent:local

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  GPUWATCH_CLOUD: local
  LOG_LEVEL: ${GW_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://gpuwatch:gpuwatch@postgres:5432/gpuwatch
  # Redis is optional for GPUWatch. Set GW_REDIS_URL= (empty) in .env to run the
  # whole stack without it: the live view and rate limits then run in process.
  REDIS_URL: ${GW_REDIS_URL-redis://redis:6379/0}
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/reports
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${GW_WEB_PORT:-4410},http://127.0.0.1:${GW_WEB_PORT:-4410}
  DASHBOARD_URL: http://localhost:${GW_WEB_PORT:-4410}
  # Alert email goes to Mailpit (http://localhost:4425); nothing leaves the machine.
  MAIL_MODE: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: GPUWatch <alerts@gpuwatch.local>
  GPUWATCH_API_URL: http://api:8080
  GW_DEMO_PASSWORD: ${GW_DEMO_PASSWORD:?run `make env` first}

x-agent-env: &agent-env
  GPUWATCH_URL: http://api:8080
  GPUWATCH_ENROLMENT_TOKEN_FILE: /demo/enrolment-token
  GPUWATCH_COLLECTOR: simulated
  GPUWATCH_INTERVAL_S: "5"
  GPUWATCH_STATE_DIR: /state
  GPUWATCH_SIM_BACKFILL_DAYS: ${GW_DEMO_DAYS:-30}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: gpuwatch
      POSTGRES_USER: gpuwatch
      POSTGRES_PASSWORD: gpuwatch
    ports:
      - "127.0.0.1:${GW_PG_PORT:-4442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpuwatch -d gpuwatch"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Latest sample per GPU (the live view), rate limits and the config version stamp.
  # Optional: losing it costs the live view a refresh, never data (Postgres holds every
  # sample, and signed-out sessions live in Postgres too).
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${GW_REDIS_PORT:-4479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches alert email locally: open http://localhost:4425.
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${GW_MAILPIT_PORT:-4425}:8025"
      # SMTP, published for the integration suite (alert email lands here too).
      - "127.0.0.1:${GW_SMTP_PORT:-4426}:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply Alembic migrations before anything that reads the schema starts.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${GW_API_PORT:-4430}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - reports:/data/reports
      - demo:/demo
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  # Rollups, cost attribution, insights, alert evaluation, notifications, retention.
  worker:
    <<: *api-image
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - reports:/data/reports
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: gpuwatch-web:local
    environment:
      # Server-side only: Next rewrites /api/* to the API on the Compose network, so the
      # browser talks to one origin (no CORS, first-party cookies).
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${GW_WEB_PORT:-4410}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── demo profile ──────────────────────────────────────────────────────────
  # A vLLM-compatible /metrics endpoint whose traffic follows the inference host's
  # simulated load (same scenario, same clock).
  mock-vllm:
    <<: *agent-image
    profiles: ["demo"]
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["gpuwatch-mock-vllm", "--host", "0.0.0.0", "--port", "4450"]
    ports:
      - "127.0.0.1:${GW_MOCK_VLLM_PORT:-4450}:4450"
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4450/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agent-train:
    <<: *agent-image
    profiles: ["demo"]
    hostname: train-node-01
    environment:
      <<: *agent-env
      GPUWATCH_SIM_PROFILE: training
      GPUWATCH_MACHINE_ID: demo-train-node-01
      GPUWATCH_LABELS: role=training,site=dc-1
    read_only: true
    volumes:
      - demo:/demo:ro
      - agent-train:/state
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  agent-infer:
    <<: *agent-image
    profiles: ["demo"]
    hostname: infer-node-01
    environment:
      <<: *agent-env
      GPUWATCH_SIM_PROFILE: inference
      GPUWATCH_MACHINE_ID: demo-infer-node-01
      GPUWATCH_LABELS: role=inference,site=dc-1
      GPUWATCH_INFERENCE: llama-chat=vllm,http://mock-vllm:4450/metrics,0;summarizer=tgi,http://mock-vllm:4450/tgi/metrics,1
    read_only: true
    volumes:
      - demo:/demo:ro
      - agent-infer:/state
    depends_on:
      api:
        condition: service_healthy
      mock-vllm:
        condition: service_healthy
    restart: unless-stopped

  agent-dev:
    <<: *agent-image
    profiles: ["demo"]
    hostname: dev-workstation
    environment:
      <<: *agent-env
      GPUWATCH_SIM_PROFILE: workstation
      GPUWATCH_MACHINE_ID: demo-dev-workstation
      GPUWATCH_LABELS: role=dev,site=office
    read_only: true
    volumes:
      - demo:/demo:ro
      - agent-dev:/state
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  reports:
  demo:
  agent-train:
  agent-infer:
  agent-dev:
