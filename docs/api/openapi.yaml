components:
  schemas:
    Ack:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: Ack
    AgentInfo:
      properties:
        version:
          type: string
          maxLength: 120
          title: Version
        collector:
          type: string
          enum:
          - nvml
          - dcgm
          - simulated
          title: Collector
        hostname:
          type: string
          maxLength: 255
          minLength: 1
          title: Hostname
        os:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Os
        kernel:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Kernel
        driver_version:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Driver Version
        cuda_version:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Cuda Version
        interval_s:
          type: number
          maximum: 3600.0
          exclusiveMinimum: 0.0
          title: Interval S
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
          default: ok
        problems:
          items:
            $ref: '#/components/schemas/Problem'
          type: array
          maxItems: 20
          title: Problems
      type: object
      required:
      - version
      - collector
      - hostname
      - interval_s
      title: AgentInfo
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        actor_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Email
        action:
          type: string
          title: Action
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        details:
          additionalProperties: true
          type: object
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_id
      - actor_email
      - action
      - target_type
      - target_id
      - details
      - ip
      title: AuditOut
    Batch:
      properties:
        batch_id:
          type: string
          format: uuid
          title: Batch Id
        agent:
          $ref: '#/components/schemas/AgentInfo'
        gpus:
          items:
            $ref: '#/components/schemas/GpuInfo'
          type: array
          maxItems: 256
          title: Gpus
        samples:
          items:
            $ref: '#/components/schemas/GpuSampleIn'
          type: array
          title: Samples
        processes:
          items:
            $ref: '#/components/schemas/ProcessIn'
          type: array
          title: Processes
        inference:
          items:
            $ref: '#/components/schemas/InferenceIn'
          type: array
          maxItems: 2000
          title: Inference
      type: object
      required:
      - batch_id
      - agent
      title: Batch
    BatchAccepted:
      properties:
        accepted:
          type: boolean
          title: Accepted
        duplicate:
          type: boolean
          title: Duplicate
        samples:
          type: integer
          title: Samples
        processes:
          type: integer
          title: Processes
        inference:
          type: integer
          title: Inference
        dropped:
          type: integer
          title: Dropped
        next_in_s:
          type: number
          title: Next In S
      type: object
      required:
      - accepted
      - duplicate
      - samples
      - processes
      - inference
      - dropped
      - next_in_s
      title: BatchAccepted
    ChannelIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        kind:
          type: string
          enum:
          - email
          - webhook
          title: Kind
        emails:
          items:
            type: string
            maxLength: 320
            pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          type: array
          maxItems: 20
          title: Emails
        url:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Url
        secret:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Secret
        enabled:
          type: boolean
          title: Enabled
          default: true
      type: object
      required:
      - name
      - kind
      title: ChannelIn
    ChannelOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        kind:
          type: string
          enum:
          - email
          - webhook
          title: Kind
        emails:
          items:
            type: string
          type: array
          title: Emails
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        signed:
          type: boolean
          title: Signed
          description: Webhook deliveries carry an HMAC signature
        enabled:
          type: boolean
          title: Enabled
        last_delivery_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Delivery At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - kind
      - emails
      - url
      - signed
      - enabled
      - last_delivery_at
      - last_error
      - created_at
      title: ChannelOut
    CostRow:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        nusd:
          type: integer
          title: Nusd
        idle_nusd:
          type: integer
          title: Idle Nusd
        gpu_hours:
          type: number
          title: Gpu Hours
        share:
          type: number
          title: Share
          description: Share of the total cost, 0 to 1
      type: object
      required:
      - key
      - label
      - nusd
      - idle_nusd
      - gpu_hours
      - share
      title: CostRow
