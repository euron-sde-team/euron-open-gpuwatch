        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gpu Id
      - name: window_hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 720
          minimum: 1
          default: 24
          title: Window Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuProcesses'
        '422':
