openapi: 3.1.0
info:
  title: Euron Open GPUWatch
  description: "\nSelf-hosted GPU monitoring and cost intelligence. Agents on your GPU machines send NVIDIA\n\
    metrics (NVML or an existing DCGM exporter), processes and inference server metrics; GPUWatch\nkeeps\
    \ the history, attributes every GPU-hour to a workload or to idle, finds waste and\nslowdowns, and\
    \ alerts by email or webhook. It observes and recommends; it never starts or\nstops anything on your\
    \ machines.\n\n* `/ingest/v1/*`: the agent contract (enrolment token, then a host token).\n* `/api/v1/*`:\
    \ the dashboard API. Authenticate with a session token\n  (`POST /api/v1/auth/login`) or, for read-only\
    \ automation, an API key\n  (`Authorization: Bearer gwk_...`).\n* `/metrics`: Prometheus metrics,\
    \ including one gauge per GPU for the whole fleet.\n"
  version: 0.1.0
paths:
  /ingest/v1/enroll:
    post:
      tags:
      - ingest
      summary: Exchange an enrolment token for a host token
      operationId: enroll_ingest_v1_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolled'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ingest/v1/batches:
    post:
      tags:
      - ingest
      summary: 'Send one collection interval: inventory, GPU samples, processes, inference'
      operationId: batches_ingest_v1_batches_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
