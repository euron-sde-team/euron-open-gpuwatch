          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EnrolmentTokenOut'
                type: array
                title: Response List Tokens Api V1 Enrolment Tokens Get
    post:
      tags:
      - fleet
      summary: Create an enrolment token (shown once)
      operationId: create_token_api_v1_enrolment_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolmentTokenIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentTokenCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/enrolment-tokens/{token_id}/revoke:
    post:
      tags:
      - fleet
      summary: Revoke an enrolment token (hosts already enrolled keep working)
      operationId: revoke_token_api_v1_enrolment_tokens__token_id__revoke_post
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Token Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentTokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/gpus/{gpu_id}/metrics:
    get:
      tags:
      - telemetry
      summary: GPU history
      operationId: gpu_metrics_api_v1_gpus__gpu_id__metrics_get
      parameters:
      - name: gpu_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gpu Id
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Default: 1 hour before end'
          title: Start
        description: 'Default: 1 hour before end'
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Default: now'
          title: End
        description: 'Default: now'
      - name: resolution
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - raw
            - 1m
            - 1h
            type: string
          - type: 'null'
          description: 'Default: chosen from the range'
          title: Resolution
        description: 'Default: chosen from the range'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/gpus/{gpu_id}/processes:
