          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys/{key_id}:
    patch:
      tags:
      - api keys
      summary: Update a key's name, limit or expiry
      operationId: update_key_api_v1_keys__key_id__patch
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
