      operationId: cost_summary_api_v1_costs_get
      parameters:
      - name: group_by
        in: query
        required: false
        schema:
          enum:
          - workload
          - team
          - host
          - gpu
          - model
          type: string
          default: workload
          title: Group By
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Default: 7 days before end'
          title: Start
        description: 'Default: 7 days before end'
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Default: now'
          title: End
        description: 'Default: now'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/costs/series:
    get:
      tags:
      - costs
      summary: Cost over time, grouped
      operationId: cost_series_api_v1_costs_series_get
      parameters:
      - name: group_by
        in: query
        required: false
        schema:
          enum:
          - workload
          - team
          - host
          - gpu
          - model
          type: string
          default: workload
          title: Group By
      - name: start
        in: query
        required: false
        schema:
