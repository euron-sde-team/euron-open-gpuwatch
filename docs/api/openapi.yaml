      operationId: list_rates_api_v1_rates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RateOut'
                type: array
                title: Response List Rates Api V1 Rates Get
    post:
      tags:
      - costs
      summary: Set a rate
      operationId: create_rate_api_v1_rates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateIn'
