          type: string
          format: uuid
          title: Gpu Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpuUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/enrolment-tokens:
    get:
      tags:
      - fleet
      summary: Enrolment tokens
      operationId: list_tokens_api_v1_enrolment_tokens_get
      responses:
