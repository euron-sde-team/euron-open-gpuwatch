<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open GPUWatch</title>
  <desc id="d">See what every GPU is doing and what it costs: self-hosted GPU monitoring, cost attribution, idle detection and alerts</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a19"/>
      <stop offset="1" stop-color="#170f26"/>
    </linearGradient>
    <linearGradient id="util" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9333ea" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#f5efff" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open GPUWatch</text>
    <text x="74" y="186" fill="#bfaedb" font-size="22" font-weight="400">See what every GPU is doing, and what it costs.</text>
    <text x="74" y="246" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9d8bbd" xml:space="preserve">live metrics<tspan fill="#3d2d5a">  /  </tspan>cost per workload<tspan fill="#3d2d5a">  /  </tspan>idle found<tspan fill="#3d2d5a">  /  </tspan>alerts<tspan fill="#3d2d5a">  /  </tspan>observe only</text>
  </g>

  <!-- Four GPU tiles: three busy, one holding a model while idle, flagged with its monthly cost -->
  <g transform="translate(828 54)" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11">
    <circle cx="190" cy="106" r="132" fill="url(#halo)"/>

    <g>
      <rect x="0" y="0" width="182" height="92" rx="12" fill="#1f1533"/>
      <text x="14" y="24" fill="#d8ccef">GPU 0  H100</text>
      <text x="168" y="24" fill="#c084fc" text-anchor="end">96%</text>
      <rect x="14" y="38" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="38" width="148" height="7" rx="3.5" fill="url(#util)"/>
      <rect x="14" y="56" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="56" width="142" height="7" rx="3.5" fill="#38bdf8"/>
      <text x="14" y="82" fill="#8a78ab">llm-finetune</text>
    </g>

    <g transform="translate(198 0)">
      <rect x="0" y="0" width="182" height="92" rx="12" fill="#1f1533"/>
      <text x="14" y="24" fill="#d8ccef">GPU 1  L40S</text>
      <text x="168" y="24" fill="#c084fc" text-anchor="end">92%</text>
      <rect x="14" y="38" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="38" width="142" height="7" rx="3.5" fill="url(#util)"/>
      <rect x="14" y="56" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="56" width="140" height="7" rx="3.5" fill="#38bdf8"/>
      <text x="14" y="82" fill="#8a78ab">llama-chat</text>
    </g>

    <g transform="translate(0 108)">
      <rect x="0" y="0" width="182" height="92" rx="12" fill="#1f1533"/>
      <text x="14" y="24" fill="#d8ccef">GPU 3  H100</text>
      <text x="168" y="24" fill="#fb7185" text-anchor="end">86&#176;C</text>
      <rect x="14" y="38" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="38" width="145" height="7" rx="3.5" fill="url(#util)"/>
      <rect x="14" y="56" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="56" width="140" height="7" rx="3.5" fill="#38bdf8"/>
      <text x="14" y="82" fill="#fb7185">thermal limit</text>
    </g>

    <g transform="translate(198 108)">
      <rect x="0" y="0" width="182" height="92" rx="12" fill="#1f1533" stroke="#f59e0b" stroke-opacity="0.55"/>
      <text x="14" y="24" fill="#d8ccef">GPU 7  H100</text>
      <text x="168" y="24" fill="#fbbf24" text-anchor="end">1%</text>
      <rect x="14" y="38" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="38" width="3" height="7" rx="1.5" fill="url(#util)"/>
      <rect x="14" y="56" width="154" height="7" rx="3.5" fill="#2e2147"/>
      <rect x="14" y="56" width="60" height="7" rx="3.5" fill="#38bdf8"/>
      <text x="14" y="82" fill="#fbbf24">idle, model loaded</text>
    </g>

    <text x="380" y="226" fill="#fbbf24" text-anchor="end">$1,530 a month for nothing</text>
  </g>
</svg>
